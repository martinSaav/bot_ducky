name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests & Coverage (Python)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install runtime dependencies
        run: pip install -r requirements.txt

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests with coverage
        env:
          # Variables mínimas para que cfg no explote al importar
          TWITCH_CLIENT_ID: "ci_dummy"
          TWITCH_CLIENT_SECRET: "ci_dummy"
          TWITCH_CHANNEL: "ci_dummy"
        run: |
          pytest \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-report=html:htmlcov \
            -v

      - name: Upload HTML coverage report as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/
          retention-days: 14

      - name: Validate Riot API Key
        env:
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
          RIOT_ID: ${{ vars.RIOT_ID || 'Martin#123' }}
          RIOT_REGION: ${{ vars.RIOT_REGION || 'americas' }}
        if: env.RIOT_API_KEY != ''
        run: |
          python -c "
          import urllib.request, urllib.error, urllib.parse, sys, os
          api_key = os.environ['RIOT_API_KEY']
          riot_id = os.environ['RIOT_ID']
          region = os.environ['RIOT_REGION']
          if '#' not in riot_id: sys.exit(0)
          name, tag = riot_id.split('#', 1)
          name = urllib.parse.quote(name)
          tag = urllib.parse.quote(tag)
          url = f'https://{region}.api.riotgames.com/riot/account/v1/accounts/by-riot-id/{name}/{tag}'
          req = urllib.request.Request(url, headers={'X-Riot-Token': api_key})
          try:
              urllib.request.urlopen(req)
              print('Riot API key is valid!')
          except urllib.error.HTTPError as e:
              if e.code in (401, 403):
                  print(f'::error::Riot API key rejected (HTTP {e.code}). It may have expired.')
                  sys.exit(1)
              print(f'::warning::Riot API returned HTTP {e.code}')
          except Exception as e:
              print(f'::warning::Could not validate Riot API key: {e}')
          "

      - name: Coverage summary in job log
        if: always()
        run: |
          python -m coverage report --skip-covered | tail -5

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  rust-test:
    name: Tests (Rust agent)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            agent/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('agent/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run Rust unit tests
        working-directory: agent
        run: cargo test --locked
