[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
addopts = [
    "--tb=short",
    "-q",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "src/discord_presence/*",  # requires discord.py installed
    "src/drive.py",            # heavy I/O with Google Drive
    "src/agent_server.py",     # integration HTTP server
    "src/chat_control.py",     # local TCP server
    "src/clips/pipeline.py",   # heavy I/O: yt-dlp + Google Drive
    "src/logging_setup.py",    # logging configuration, trivial
    "src/riot/lol.py",         # external HTTP client (Riot API)
    "src/riot/valorant.py",    # external HTTP client (HenrikDev)
    "src/twitch/auth.py",      # OAuth flow with a local server
    "src/twitch/helix.py",     # external HTTP client (Twitch API)
    "src/chat_embeddings.py",  # external HTTP client (OpenAI embeddings)
    "src/chat_history_db.py",  # requires asyncpg + a real PostgreSQL
    "src/llm_summary.py",      # external HTTP client (LLM)
]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 50
