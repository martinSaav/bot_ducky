[package]
name = "twitch-game-agent"
version = "0.1.0"
edition = "2021"
description = "Detects which game is running and tells the Twitch bot"

[dependencies]
sysinfo = { version = "0.32", default-features = false, features = ["system"] }
# No TLS on purpose: the link is already encrypted by Tailscale (WireGuard),
# and HTTPS calls to Riot's local APIs are delegated to curl.exe.
ureq = { version = "2.10", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
