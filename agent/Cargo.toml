[package]
name = "twitch-game-agent"
version = "0.1.0"
edition = "2021"
description = "Detecta que juego esta corriendo y se lo avisa al bot de Twitch"

[dependencies]
sysinfo = { version = "0.32", default-features = false, features = ["system"] }
# Sin TLS a proposito: el enlace ya va cifrado por Tailscale (WireGuard) y
# rustls arrastra `ring`, que necesita un compilador de C para armarse.
ureq = { version = "2.10", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
