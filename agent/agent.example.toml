# Agent configuration. Copy to agent.toml, next to the .exe.
#
# Important rule: ONLY the games declared below are reported.
# Any other open program is discarded on the spot and never leaves the
# machine.

# Bot endpoint. With Tailscale it is the 100.x IP that `tailscale ip -4`
# prints on the PC where the bot runs.
endpoint = "http://100.0.0.0:8787/game"

# Shared secret. Must be identical to AGENT_TOKEN in the bot's .env.
# Generate one with:  python -c "import secrets; print(secrets.token_urlsafe(32))"
token = "CHANGEME"

# How often processes are checked.
poll_seconds = 5

# How often the state is re-sent even if it did not change, so the bot
# knows the agent is alive.
heartbeat_seconds = 60

log_file = "agent.log"

# ---------------------------------------------------------------------------
#  Games
#
#  name      = EXACT name of the Twitch category
#  priority  = when two rules match at the same time, the higher number wins.
#              That is why the game (20) beats the launcher (10): with the
#              Riot client and the match open at once, it reports the match.
#  processes = executables that count. Case-insensitive.
#
#  To add a new one: open the game and run  twitch-game-agent.exe --scan
# ---------------------------------------------------------------------------

[[games]]
name = "VALORANT"
priority = 20
processes = ["VALORANT-Win64-Shipping.exe"]

[[games]]
name = "VALORANT"
priority = 10
processes = ["VALORANT.exe"]

# NOTE: TFT runs inside the same executable as LoL, so the two cannot be told
# apart by process. A TFT match will show up as "League of Legends"; fix it
# from chat with  !categoria Teamfight Tactics
[[games]]
name = "League of Legends"
priority = 20
processes = ["League of Legends.exe"]

