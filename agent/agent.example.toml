# Configuracion del agente. Copiar a agent.toml, al lado del .exe.
#
# Regla importante: SOLO se reportan los juegos declarados aca abajo.
# Cualquier otro programa que este abierto se descarta en el acto y nunca
# sale de la maquina.

# Endpoint del bot. Con Tailscale es la IP 100.x que te da `tailscale ip -4`
# en la PC donde corre el bot.
endpoint = "http://100.0.0.0:8787/game"

# Secreto compartido. Tiene que ser identico a AGENT_TOKEN en el .env del bot.
# Genera uno con:  python -c "import secrets; print(secrets.token_urlsafe(32))"
token = "CAMBIAME"

# Cada cuanto se miran los procesos.
poll_seconds = 5

# Cada cuanto se reenvia el estado aunque no haya cambiado, para que el bot
# sepa que el agente sigue vivo.
heartbeat_seconds = 60

log_file = "agent.log"

# ---------------------------------------------------------------------------
#  Juegos
#
#  name      = nombre EXACTO de la categoria en Twitch
#  priority  = ante dos coincidencias simultaneas gana el numero mas alto.
#              Por eso el juego (20) le gana al launcher (10): con el cliente
#              de Riot y la partida abiertos a la vez, reporta la partida.
#  processes = ejecutables que cuentan. No distingue mayusculas.
#
#  Para agregar uno nuevo: abri el juego y corre  twitch-game-agent.exe --scan
# ---------------------------------------------------------------------------

[[games]]
name = "VALORANT"
priority = 20
processes = ["VALORANT-Win64-Shipping.exe"]

[[games]]
name = "VALORANT"
priority = 10
processes = ["VALORANT.exe"]

# OJO: TFT corre dentro del mismo ejecutable que el LoL, asi que por proceso
# no se pueden distinguir. Si arranca una partida de TFT va a quedar en
# "League of Legends"; se corrige desde el chat con  !categoria Teamfight Tactics
[[games]]
name = "League of Legends"
priority = 20
processes = ["League of Legends.exe"]

