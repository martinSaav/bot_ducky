# ==============================================================================
#  SonarCloud configuration
# ==============================================================================

# Replace these with the Organization Key and Project Key SonarCloud gives you
sonar.organization=duckydev
sonar.projectKey=bot_ducky

# Source directories (tests and miscellaneous scripts are excluded)
sonar.sources=src,agent/src
sonar.exclusions=src/tests/**,agent/tests/**,**/*.pyc,**/__pycache__/**

# Python coverage report (generated by pytest --cov-report=xml in ci.yml)
sonar.python.coverage.reportPaths=coverage.xml

# Language configuration (optional, helps the analysis)
sonar.language=py,rust
