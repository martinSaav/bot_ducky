# ==============================================================================
#  Configuración de SonarCloud
# ==============================================================================

# Reemplazá esto por la Organization Key y Project Key que te da SonarCloud
sonar.organization=my-first-organization-12345
sonar.projectKey=twitch-agent

# Directorios de código fuente (excluimos tests y scripts varios)
sonar.sources=src,agent/src
sonar.exclusions=src/tests/**,agent/tests/**,**/*.pyc,**/__pycache__/**

# Reporte de cobertura de Python (generado por pytest --cov-report=xml en ci.yml)
sonar.python.coverage.reportPaths=coverage.xml

# Configuración de lenguaje (opcional, ayuda al análisis)
sonar.language=py,rust
